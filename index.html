<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главный портал</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent-color: #38bdf8;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --text-color: #0f172a;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --accent-color: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s ease;
        }
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
        }
        h1 { color: var(--accent-color); margin-bottom: 20px; text-align: center; }
        .nav-container { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; }
        .btn {
            display: block;
            background: var(--card-bg);
            color: var(--text-color);
            text-decoration: none;
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid var(--border-color);
            transition: 0.2s;
        }
        .btn:hover { border-color: var(--accent-color); color: var(--accent-color); }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">🌓 Сменить тему</button>

    <h1>Главное Меню</h1>

    <div class="nav-container">
        <a href="channels.html" class="btn">📢 Мои Каналы и Группы</a>
        <a href="projects.html" class="btn">🚀 Запланированные Проекты</a>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const newTheme = body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
        }
    </script>

</body>
</html>
